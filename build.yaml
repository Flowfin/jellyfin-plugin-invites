overview: "Invitation links that let somebody set up their own account. Under development: an operator can mint and revoke a link, and no link can be redeemed yet."
description: >
  An operator invites somebody with a link, and the person sets up their own account without the operator creating it by hand or handing out a password.

  The half an operator drives runs and the half an invited person drives does not. What installs today adds one page to the server dashboard, and on it an operator sets the public address, mints an invitation, reads the outstanding ones, revokes one and rotates the key the codes are stored under. No link can be redeemed and no account is created by this plugin, so an invitation minted today cannot be spent by anybody.
category: "Administration"
