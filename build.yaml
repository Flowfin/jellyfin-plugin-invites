overview: "Invitation links that let somebody set up their own account. Under development: an operator mints and revokes a link, and a person following one sets up their own account."
description: >
  An operator invites somebody with a link, and the person sets up their own account without the operator creating it by hand or handing out a password.

  Both halves run. What installs today adds one page to the server dashboard, and on it an operator sets the public address, writes down the account templates an invitation is minted against, mints an invitation, reads the outstanding ones, revokes one and rotates the key the codes are stored under. A person following an invitation link is served a setup page, and posting it back creates the account that invitation was scoped for, so a link minted today can be spent by whoever holds it. No version has been published and nothing here has been run against a Jellyfin server.
