# A fixture, and a fixture vocabulary is a fixture vocabulary. Nothing here names
# this plugin: a fixture built out of the real build.yaml proves the state of the
# tree on the day it ran rather than proving the reader, and the day somebody
# edits the real file the fixture moves with it for a reason the selftest is not
# about.
#
# What it exercises that a simpler file would not: a quoted scalar, an unquoted
# one, a folded block over two paragraphs, a literal block, a key whose value
# holds a double quote and a backslash, and a list the reader must walk past
# without reading it as a scalar.
name: "Fixture Plugin"
