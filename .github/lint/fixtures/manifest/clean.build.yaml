overview: An unquoted overview, ending at a comment. # this half is not the value
description: >
  A folded paragraph that is wrapped across two lines in the file and is one
  line in the entry.

  A second paragraph, kept apart from the first by the blank line above it. It
  holds a "quoted phrase" and a backslash \ so the escaping is exercised rather
  than assumed.
category: Administration
