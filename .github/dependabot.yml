# Dependency updates for this repository, decided on #23.
#
# Everything the bot does here is named in this file rather than inherited from a
# preset, because a bot that can raise a version is a bot whose merged output is
# code this project did not write, and the rules deciding that should be readable
# next to the tree they act on.
#
# Two entries per ecosystem, split by `applies-to`. A routine bump and an
# advisory are not the same decision and this file stops treating them as one: a
# routine bump is held for seven days, leaves the Jellyfin packages alone and
# arrives grouped, while an advisory is held for nothing, excludes nothing and
# arrives carrying `security` so an operator can find it without reading four
# diffs.
#
# The key has to be on both halves of a pair. An entry that omits it is a version
# update configuration whatever the entry beside it says, so a pair carrying the
# key on one side only collides on the rule the validator states as "Update
# configs must have a unique combination of 'package-ecosystem', 'directory', and
# 'target-branch'", and what that refuses is the file rather than the second
# entry.
version: 2

updates:
  # Routine package bumps.
  - package-ecosystem: "nuget"
    directory: "/"
    applies-to: version-updates
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 3
    ignore:
      # The Jellyfin server packages are not a staleness question. Their version
      # is the server line this plugin is built for, decided in
      # Directory.Build.props and read from the same place by the packaging
      # manifest and the floor build, so a bot raising it would move the plugin
      # to a server line nobody chose and would do it by editing a number three
      # other things derive from. Moving that line is a deliberate change with
      # its own issue.
      #
      # The exclusion is on this entry rather than on the advisory one below,
      # which is what keeps it an exclusion from ROUTINE bumps rather than from
      # everything. An ignore reaching both kinds would turn a decision about a
      # server line into two packages nobody patches.
      #
      # The three `version-update:` entries say the same thing a second time,
      # from inside the rule rather than from the entry it sits on. They are
      # kept because the two readings fail differently: if `applies-to` ever
      # stops holding these two entries apart, an ignore naming a dependency and
      # nothing else silently swallows the advisory as well, and the second
      # statement is what stands between that and an unpatched package.
      - dependency-name: "Jellyfin.Controller"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "Jellyfin.Model"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      test-packages:
        # The test-only packages move together. They are one decision to a
        # reader: either the suite still runs on the new versions or it does
        # not, and the check that answers that is the same run either way.
        # coverlet.msbuild is in this group and was not in the Renovate rule
        # this file replaces. It is test-only and it moves under the same
        # question, and leaving it out would have produced a pull request per
        # month whose whole content is a coverage collector.
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit"
          - "xunit.runner.visualstudio"
          - "coverlet.msbuild"
      analyzers:
        # The analyzers are separate from the test packages. Warnings are errors
        # in this tree, so an analyzer version is the one dependency bump that
        # can red the build for a reason in the plugin's own source rather than
        # in a dependency.
        patterns:
          - "SerilogAnalyzer"
          - "StyleCop.Analyzers"
          - "SmartAnalyzers.MultithreadingAnalyzer"
    # Hold a newly published version for seven days before it may enter a pull
    # request, so a release compromised between publish and adoption has time to
    # surface in the advisory feeds first. The number is the one
    # Flowfin/jellyfin-plugin-sso already carries, so the fleet holds one figure
    # rather than one per board.
    #
    # No tier keys. Shortening the patch tier would speed up only the
    # non-security bumps, and the patch tier is where a registry compromise
    # publishes.
    #
    # What the hold does not reach, and no comment here should claim otherwise:
    # a tag moved onto a malicious commit. The release keeps its original
    # publication date, so there is no new publication for a date-based hold to
    # delay.
    cooldown:
      default-days: 7

  # Advisories against packages.
  - package-ecosystem: "nuget"
    directory: "/"
    applies-to: security-updates
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "security"
    # No ignore list and no groups. Every package this tree references is in
    # scope for an advisory, the Jellyfin ones included, and an advisory arrives
    # on its own so that what a reader is being asked to judge is one package
    # and one vulnerability rather than a month of bumps with one of them
    # urgent.
    #
    # The hold below does not hold anything. GitHub says in its own words that a
    # cooldown does not apply to security updates, so an advisory is raised when
    # the advisory lands rather than seven days later, and a hold on an advisory
    # would be a hold on the patch for it. It is written out because the workflow
    # audit refuses an update entry with no cooldown at all, by name and at high
    # confidence, with `warning[dependabot-cooldown]: insufficient cooldown in
    # Dependabot updates` pointed at the entry that lacks one.
    #
    # An entry left bare would red the gate on every push, and a suppression
    # would take the rule off the routine entries as well.
    cooldown:
      default-days: 7

  # Routine action bumps.
  - package-ecosystem: "github-actions"
    directory: "/"
    applies-to: version-updates
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 3
    groups:
      # First, because a dependency joins the first group whose patterns match
      # it. github/codeql-action/init and .../analyze are two dependencies to
      # the bot and one thing to the workflow: a run whose two steps are on
      # different versions stops with "Loaded a configuration file for version
      # X, but running version Y", so neither half of a split is repairable on
      # its own. This group is not restricted by update type, because that
      # failure does not care whether the jump was major.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions:
        # Everything else that is not a major jump arrives as one pull request
        # rather than one per action.
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # A major action jump is left ungrouped by the update-types above, so it
    # arrives on its own. It is the case where the inputs, the outputs or the
    # permissions of a step can have changed underneath, and grouping it with
    # routine bumps is how that gets read as routine.
    #
    # Every `uses:` in this tree is a commit hash with the tag in a trailing
    # comment, and the bot rewrites both together rather than replacing the pin
    # with a tag. Measured on #290 rather than taken from the documentation.
    #
    # The same seven days as above, for the same reason. It does not reach a tag
    # moved onto a malicious commit, which publishes no new version; what stands
    # against that here is the commit-hash pin plus the unpinned-uses audit in
    # .github/workflows/zizmor.yml, which refuses a ref that is not a SHA.
    cooldown:
      default-days: 7

  # Advisories against actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    applies-to: security-updates
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
      - "security"
    # Ungrouped, and carrying the same inert hold as the package advisory entry
    # above for the same two reasons.
    cooldown:
      default-days: 7
