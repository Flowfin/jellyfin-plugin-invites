name: '🧪 Test Plugin'

on:
  # No paths-ignore, for the reason written in build.yaml.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # The job id is `call` because the required check context is `call / test`.
  call:
    uses: ./.github/workflows/plugin-test.yaml
    permissions:
      contents: read
