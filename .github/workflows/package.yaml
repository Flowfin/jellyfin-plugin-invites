name: '📦 Package Plugin'

on:
  # Every pull request, so a packaging mistake is found here rather than by the
  # people who install the result. No paths-ignore, for the reason in build.yaml.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Package with the plugin repository manager
        # Reads the committed build.yaml, so the package produced here is the
        # one the release will produce rather than a separate recipe.
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        id: jprm
        with:
          dotnet-target: 'net9.0'

      - name: The packaged file list equals the artifact list in build.yaml
        # #20 asks for this comparison and here it is, but read what it can and
        # cannot catch. The packager builds the archive FROM this same list and
        # refuses outright when the list names a file the build did not produce,
        # so that direction reds one step earlier and never reaches here. What is
        # left for this step is the archive holding something the list does not
        # name, which no input tried so far produces. It is a cheap assertion
        # that the packager did what it says, not a guard with a demonstrated
        # bite; the step below is the one that can fail. It fails closed on an
        # unreadable zip or an empty expected list rather than passing them.
        env:
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        run: |
          set -euo pipefail
          # The artifacts block of build.yaml, one filename per line. Read from
          # the committed file rather than restated here, so this check cannot
          # drift away from what it is checking.
          expected=$(awk '
            /^artifacts:/ {inblock=1; next}
            inblock && /^[a-zA-Z]/ {inblock=0}
            inblock && /^-/ {gsub(/^- *"?/,""); gsub(/"?[[:space:]]*$/,""); print}
          ' build.yaml | sort)
          if [ -z "$expected" ]; then
            echo "::error::No artifacts listed in build.yaml. Refusing to compare against an empty list."
            exit 1
          fi
          if ! actual=$(unzip -Z1 "$ARTIFACT" | grep -v '^meta.json$' | sort); then
            echo "::error::Could not read the packaged archive at ${ARTIFACT}."
            exit 1
          fi
          echo "build.yaml artifacts:"; echo "$expected"
          echo "packaged, excluding the manifest the packager adds:"; echo "$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The packaged file list does not match the artifact list in build.yaml."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "The package holds exactly what build.yaml names."

      - name: Nothing ships that the artifact list does not name
        # This is the guard with a bite. The plugin excludes the runtime assets
        # of the server's own packages, so the publish closure of a plugin with
        # no runtime dependencies is exactly the assemblies build.yaml names. Add
        # a runtime package reference and its assembly appears here while the
        # artifact list stays as it was, which is a package that installs and
        # then throws on the server for a type it cannot find. The comparison is
        # against the closure the compiler produced, so it cannot be satisfied by
        # editing the list alone.
        run: |
          set -euo pipefail
          expected=$(awk '
            /^artifacts:/ {inblock=1; next}
            inblock && /^[a-zA-Z]/ {inblock=0}
            inblock && /^-/ {gsub(/^- *"?/,""); gsub(/"?[[:space:]]*$/,""); print}
          ' build.yaml | sort)
          if [ -z "$expected" ]; then
            echo "::error::No artifacts listed in build.yaml. Refusing to compare against an empty list."
            exit 1
          fi
          rm -rf publish
          dotnet publish Jellyfin.Plugin.Invites/Jellyfin.Plugin.Invites.csproj \
            --configuration Release --output publish
          shipped=$(find publish -maxdepth 1 -name '*.dll' -printf '%f\n' | sort)
          if [ -z "$shipped" ]; then
            echo "::error::The publish output holds no assemblies. Refusing to compare against an empty closure."
            exit 1
          fi
          echo "build.yaml artifacts:"; echo "$expected"
          echo "assemblies in the publish closure:"; echo "$shipped"
          if [ "$expected" != "$shipped" ]; then
            echo "::error::The publish closure and the artifact list in build.yaml disagree. A dependency that ships has to be listed, and a listed artifact has to be built."
            diff <(echo "$expected") <(echo "$shipped") || true
            exit 1
          fi
          echo "Everything that ships is named in build.yaml, and nothing else."
          # Kept beside the bill of materials because the two answer different
          # questions and only this one answers #35's. The bill of materials is
          # the restore graph, so it lists every package the compiler saw,
          # including the server's own and the analyzers, and a reader cannot
          # tell from it which of them ship. This file is the set that ships.
          mkdir -p sbom
          printf '%s\n' "$shipped" > sbom/publish-closure.txt

      - name: Generate the bill of materials
        # The plan keeps this plugin's runtime dependency set empty. A pull
        # request that quietly adds a package arrives as a new component here
        # instead of as nothing at all.
        #
        # Read what this file is. It is the restore graph of the project, so it
        # lists the server's own packages and the analyzers alongside anything
        # this plugin brought, and none of those three classes is marked in it.
        # It is the record of what the compiler saw, not the answer to whether
        # the runtime set is empty. The step above writes that answer to
        # sbom/publish-closure.txt, and the two travel together.
        run: |
          set -euo pipefail
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX Jellyfin.Plugin.Invites/Jellyfin.Plugin.Invites.csproj \
            --output sbom --json --set-name jellyfin-plugin-invites
          ls -l sbom

      - name: Keep the package and the bill of materials together
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-package
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.jprm.outputs.artifact }}
            sbom/
