# A table column that points at work still to come, held to the tracker.
#
# `Produced by` on `docs/attempt-outcomes.md` names the issue that will do a
# thing, and `.github/lint/issue-pointer-columns.txt` is the register of every
# column read here. A reader uses such a column to find out whether the thing
# they are waiting for has arrived, and an issue that has closed reads as
# arrived. The class has been repaired by hand five times, each found by
# somebody reading a page against the tracker, and once by this job.
#
# WHY THIS IS ON A SCHEDULE RATHER THAN ON A PULL REQUEST, which is the design
# and not a filing choice, and it is the same argument `tracker-claim.yaml`
# makes next door. The tracker is a network call, and a failed call and a table
# full of stale pointers arrive at the comparison as the same missing entries.
# On a merge route that makes a timeout indistinguishable from a defect and
# teaches a reader to re-run a red gate rather than read it. And a pointer here
# goes stale when somebody closes an issue rather than when somebody edits a
# file, so a merge is not the moment the answer changes. The price is stated
# rather than hidden: a column that goes stale on a Tuesday is unanswered until
# the next run.
#
# The two fetches are steps of their own for the same reason. If either call
# fails, that step fails with the call in front of it and the comparison never
# runs, so a red mark here is never ambiguous between the two causes.
#
# This is not in the branch ruleset's required set and must not be: it does not
# run on a pull request, so requiring it would block every merge on a check that
# never reports. Raising that set is #24.
#
# The context this reports is `Every forward-pointing column names open work`,
# which is the name to put in a ruleset rather than the workflow's display name.
name: '🧭 Issue Pointers'

on:
  schedule:
    # Daily, and half an hour after the claims run rather than beside it, so two
    # jobs reading the same tracker do not answer at the same minute. What this
    # reads moves whenever anybody closes an issue on this board, which is
    # several times on a working night.
    - cron: '53 5 * * *'
  workflow_dispatch:

# Read-only. The check reads tracked markdown, a register and a listing, and
# writes nothing.
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false

jobs:
  pointers:
    name: Every forward-pointing column names open work
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The check bites its own fixtures
        # First, and on every run rather than once at review time. Every
        # registered cell on this board names an open issue today, so the step
        # below cannot fire against the tree, and a parser that had stopped
        # finding a column would report the same green forever while the columns
        # it holds drifted underneath it.
        run: bash .github/lint/issue-pointer.sh selftest

      - name: Read the tracker
        # Issues and pull requests both, so a number that exists is never
        # refused for the wrong reason. A merged pull request comes back as
        # MERGED and the check reads that as closed, which is what a cell
        # pointing at one means.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json number,state --jq '.[] | "\(.number)\t\(.state)"' > states.txt || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Reading the issue list failed (exit $rc). This is the network rather than the documents, and nothing below has run. Re-run the job."
            exit 1
          fi
          rc=0
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json number,state --jq '.[] | "\(.number)\t\(.state)"' >> states.txt || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Reading the pull-request list failed (exit $rc). This is the network rather than the documents, and nothing below has run. Re-run the job."
            exit 1
          fi
          if [ ! -s states.txt ]; then
            echo "::error::The tracker read as empty. A board holding nothing and a call that answered with nothing are the same bytes here, so this refuses rather than comparing against an empty side."
            exit 1
          fi
          echo "Read $(grep -c . states.txt) issue and pull-request state(s)."

      - name: Every registered column names open work
        run: bash .github/lint/issue-pointer.sh check states.txt .github/lint/issue-pointer-columns.txt .
