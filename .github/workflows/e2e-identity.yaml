# The last clause of #3, executed rather than argued.
#
# A server keys an installed plugin by its identifier. This plugin minted its own
# and the grep says the template's is gone, but two identifiers differing in a
# grep is not the same fact as two plugins coexisting on a server, and that is
# the fact the clause asks for.
#
# So this job installs the upstream template beside this plugin on an unmodified
# published Jellyfin image and asks the server what it has. The template is built
# from jellyfin/jellyfin-plugin-template rather than assembled here, because a
# folder carrying the template's identifier and none of its code would be this
# repository answering its own question.
#
# The wizard IS completed here, unlike the authorization job, and the reason is
# the assertion: the evidence that neither plugin replaced the other is the
# server's own plugin list, which is an administrator route. The credential is
# minted inside the container, used once and destroyed with it.
name: '🪪 Plugin Identity'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  identity:
    name: This plugin installs beside the upstream template
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      # The same digest the authorization job pins, and for the same reason. It
      # is jellyfin/jellyfin:10.11.11, the shipping version of the one server
      # line build.yaml names in targetAbi.
      JELLYFIN_IMAGE: 'jellyfin/jellyfin@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db'
      JELLYFIN_URL: 'http://127.0.0.1:8096'
      # The identifiers the two plugins declare. Written out rather than read
      # from build.yaml, because what this job asserts is that the server holds
      # two DIFFERENT ones, and reading both from the trees under test would let
      # a change that made them equal pass by moving the expectation with it.
      OURS: '7565756d-8964-49fd-a2c6-f2a878d5001a'
      THEIRS: 'eb5d7894-8eef-4b36-aa6f-5d124e828ce1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the upstream template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellyfin/jellyfin-plugin-template
          path: upstream-template
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore against the committed lock file
        run: |
          set -euo pipefail
          dotnet restore --locked-mode

      - name: Build this plugin's package
        id: ours
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: 'net9.0'

      - name: Build the upstream template's package
        id: theirs
        # No locked restore here. The lock file belongs to this repository and
        # the template carries none, so a locked restore would be this job
        # imposing a rule on somebody else's tree.
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          path: ./upstream-template
          output: ./upstream-template/artifacts
          dotnet-target: 'net9.0'

      - name: Install both into one server data directory
        env:
          OURS_ARTIFACT: ${{ steps.ours.outputs.artifact }}
          THEIRS_ARTIFACT: ${{ steps.theirs.outputs.artifact }}
        run: |
          set -euo pipefail
          for pair in "invites:${OURS_ARTIFACT}" "template:${THEIRS_ARTIFACT}"; do
            name="${pair%%:*}"
            archive="${pair#*:}"
            if [ ! -f "${archive}" ]; then
              echo "::error::No archive at ${archive} for the ${name} plugin, so this job would be asking a server about something that was never installed."
              exit 1
            fi
            mkdir -p "${GITHUB_WORKSPACE}/jellyfin-data/config/plugins/${name}"
            unzip -o "${archive}" -d "${GITHUB_WORKSPACE}/jellyfin-data/config/plugins/${name}"
          done
          ls -lR "${GITHUB_WORKSPACE}/jellyfin-data/config/plugins"

      - name: Start the server
        run: |
          set -euo pipefail
          docker pull "${JELLYFIN_IMAGE}"
          docker run --detach --name jellyfin \
            --publish 127.0.0.1:8096:8096 \
            --volume "${GITHUB_WORKSPACE}/jellyfin-data/config:/config" \
            --volume "${GITHUB_WORKSPACE}/jellyfin-data/cache:/cache" \
            "${JELLYFIN_IMAGE}"

      - name: Wait for the server to finish starting
        # The public information route answers while the database migrations are
        # still running and everything else answers 503 until they finish, so the
        # wait ends on this plugin's own public route leaving 503 rather than on
        # the first 200 anywhere.
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            public="$(curl -s -o /dev/null -w '%{http_code}' "${JELLYFIN_URL}/System/Info/Public" || true)"
            if [ "${public}" = "200" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' "${JELLYFIN_URL}/redeem/ABCD-EFGH-JKLM" || true)"
              if [ "${code}" != "503" ] && [ "${code}" != "000" ]; then
                echo "The server has finished starting. /System/Info/Public answers ${public} and /redeem/{code} answers ${code}."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::The server did not finish starting within three minutes."
          docker logs jellyfin || true
          exit 1

      - name: Complete the startup wizard and take a token
        # The plugin list is an administrator route, so this is the cheapest
        # credential that can read it. The account exists only inside a container
        # this job destroys, and the password is in the file for the same reason
        # the address is: there is nothing here to keep.
        run: |
          set -euo pipefail
          auth='MediaBrowser Client="identity-job", Device="ci", DeviceId="identity-job", Version="1"'
          curl -fsS -X POST "${JELLYFIN_URL}/Startup/Configuration" \
            -H 'Content-Type: application/json' \
            -d '{"UICulture":"en-US","MetadataCountryCode":"US","PreferredMetadataLanguage":"en"}'
          curl -fsS "${JELLYFIN_URL}/Startup/User" > /dev/null
          curl -fsS -X POST "${JELLYFIN_URL}/Startup/User" \
            -H 'Content-Type: application/json' \
            -d '{"Name":"operator","Password":"identity-job-throwaway"}'
          curl -fsS -X POST "${JELLYFIN_URL}/Startup/RemoteAccess" \
            -H 'Content-Type: application/json' \
            -d '{"EnableRemoteAccess":true,"EnableAutomaticPortMapping":false}'
          curl -fsS -X POST "${JELLYFIN_URL}/Startup/Complete"
          # The response is written to a file and read back from it rather than
          # piped into python3. A download piped into an interpreter is the shape
          # Scorecard names downloadThenRun, and it reads the same whether the
          # interpreter runs the downloaded bytes or only parses them; taking
          # them off disk says which of the two this is. Read in #363. The file
          # holds the token, so it is removed as soon as the value is out of it.
          curl -fsS -X POST "${JELLYFIN_URL}/Users/AuthenticateByName" \
            -H 'Content-Type: application/json' \
            -H "Authorization: ${auth}" \
            -d '{"Username":"operator","Pw":"identity-job-throwaway"}' > auth.json
          token="$(python3 -c 'import json; print(json.load(open("auth.json"))["AccessToken"])')"
          rm -f auth.json
          if [ -z "${token}" ]; then
            echo "::error::The wizard completed but no access token came back, so the plugin list cannot be read."
            docker logs jellyfin || true
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "JELLYFIN_TOKEN=${token}" >> "$GITHUB_ENV"
          echo "The wizard is complete and a token was issued."

      - name: The server holds both plugins, under two identifiers
        # Four assertions, because the failure this clause is about has more than
        # one shape. Both identifiers present is the coexistence. Two entries
        # rather than one is that neither replaced the other. The two names being
        # different is what an operator would see. And this plugin's own route
        # still answering is the difference between loaded and merely listed.
        run: |
          set -euo pipefail
          curl -fsS "${JELLYFIN_URL}/Plugins" \
            -H "Authorization: MediaBrowser Token=\"${JELLYFIN_TOKEN}\"" > plugins.json
          python3 - <<'PY'
          import json
          import os
          import sys


          def key(value):
              # The server hands identifiers back without hyphens while every
              # place this repository writes one has them, so both sides are
              # reduced before they are compared. Without this the job reports
              # both plugins missing while printing both of them.
              return (value or "").replace("-", "").lower()


          ours = key(os.environ["OURS"])
          theirs = key(os.environ["THEIRS"])
          plugins = json.load(open("plugins.json", encoding="utf-8"))
          seen = {key(p.get("Id")): p for p in plugins}
          for p in plugins:
              print("{0}  {1}  {2}".format(p.get("Id"), p.get("Version"), p.get("Name")))

          problems = []
          if ours not in seen:
              problems.append(
                  "This plugin's identifier {0} is not in the server's plugin list, so it "
                  "did not install beside the template.".format(ours))
          if theirs not in seen:
              problems.append(
                  "The upstream template's identifier {0} is not in the server's plugin "
                  "list, so there was nothing for this plugin to coexist with and the "
                  "assertion would have been vacuous.".format(theirs))
          if ours == theirs:
              problems.append("The two identifiers are equal, which is the collision this clause is about.")
          if not problems:
              a = seen[ours].get("Name")
              b = seen[theirs].get("Name")
              if a == b:
                  problems.append(
                      "Both plugins are listed under the name {0!r}, so an operator cannot "
                      "tell them apart in the dashboard.".format(a))

          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("Both plugins are installed, under two identifiers and two names.")
          PY

      - name: This plugin still serves its own route with the template beside it
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' "${JELLYFIN_URL}/redeem/ABCD-EFGH-JKLM")"
          if [ "${code}" != "200" ]; then
            echo "::error::GET /redeem/{code} answered ${code} rather than 200 with the upstream template installed alongside. Being listed is not the same as being loaded."
            docker logs jellyfin || true
            exit 1
          fi
          echo "GET /redeem/{code} answered 200 with the upstream template installed alongside."

      - name: Stop the server
        if: always()
        run: docker rm --force jellyfin || true
