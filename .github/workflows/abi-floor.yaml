# The shipping build compiles against a package from the middle of the server
# line while build.yaml invites people to install on the oldest version of it.
# Nothing in the ordinary build notices the gap: a call into a server member that
# arrived after the floor compiles clean, packages clean, installs clean, and
# throws on the older server at the moment somebody redeems an invitation.
#
# This leg compiles the plugin against the package version the manifest's
# targetAbi names. The version is not typed here. Directory.Build.props derives
# it from targetAbi and refuses a build.yaml it cannot read one out of, so
# raising the claim in the manifest is what moves the version this leg compiles
# against, and the two cannot disagree.
#
# This is not in the branch ruleset's required set. Raising that set is #24.
name: 'ABI floor build'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny-all at workflow level; the job below grants only what it needs.
permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  floor:
    name: Build against the declared ABI floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not leave the token in .git/config where a
          # later step or a build task could read it.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Report the floor this run is about to build against
        # Printed rather than assumed, so a run that resolved something other
        # than the manifest's floor is readable in the log instead of passing
        # quietly. The build refuses an unreadable targetAbi in any case.
        run: >
          dotnet msbuild Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj
          -getProperty:JellyfinPackageVersion -p:BuildAgainstAbiFloor=true

      - name: Build against the floor
        # The plugin project only. The test project's dependencies are its own
        # and are covered by the ordinary build.
        #
        # No --locked-mode: the committed lock file pins the shipping line, and
        # this leg resolves a different version of the same two packages on
        # purpose. Directory.Build.props points the floor restore at a throwaway
        # lock file under obj/, because NuGet updates an existing lock file
        # whatever RestorePackagesWithLockFile says.
        #
        # Warnings are errors in the project file, so a clean run here is the
        # analyzers passing against the floor rather than the analyzers being
        # quiet.
        run: >
          dotnet build Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj
          --configuration Release -p:BuildAgainstAbiFloor=true

      - name: Refuse a build that left the lock file rewritten
        # If a later change lets the floor restore touch the committed lock file,
        # the shipping line's pins would arrive in a commit nobody wrote. Read
        # back rather than trusted.
        run: git diff --exit-code -- '**/packages.lock.json'
