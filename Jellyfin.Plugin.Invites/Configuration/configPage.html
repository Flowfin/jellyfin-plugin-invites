<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Template</title>
    </head>
    <body>
        <div
            id="TemplateConfigPage"
            data-role="page"
            class="page type-interior pluginConfigurationPage"
            data-require="emby-input,emby-button,emby-select,emby-checkbox"
        >
            <div data-role="content">
                <div class="content-primary">
                    <form id="TemplateConfigForm">
                        <p class="fieldDescription">There is nothing to configure yet.</p>
                        <div>
                            <button
                                is="emby-button"
                                type="submit"
                                class="raised button-submit block emby-button"
                            >
                                <span>Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            <script type="text/javascript">
                var TemplateConfig = {
                    pluginUniqueId: "7565756d-8964-49fd-a2c6-f2a878d5001a",
                };

                document
                    .querySelector("#TemplateConfigPage")
                    .addEventListener("pageshow", function () {
                        Dashboard.showLoadingMsg();
                        ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(
                            function () {
                                Dashboard.hideLoadingMsg();
                            },
                        );
                    });

                document
                    .querySelector("#TemplateConfigForm")
                    .addEventListener("submit", function (e) {
                        Dashboard.showLoadingMsg();
                        ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(
                            function (config) {
                                ApiClient.updatePluginConfiguration(
                                    TemplateConfig.pluginUniqueId,
                                    config,
                                ).then(function (result) {
                                    Dashboard.processPluginConfigurationUpdateResult(result);
                                });
                            },
                        );

                        e.preventDefault();
                        return false;
                    });
            </script>
        </div>
    </body>
</html>
